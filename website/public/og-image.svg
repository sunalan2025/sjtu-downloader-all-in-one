  <text x="80" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">一站式批量备份 Canvas 课件录播、旁听课程视频与好大学在线，</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">深度集成交大云盘双向存储，采用系统级原生硬件保险库加锁。</text>

  <!-- Feature Pill Matrix (Row of 4 Pills) -->
  <g transform="translate(80, 350)">
