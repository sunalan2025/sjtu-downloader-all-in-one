  <text x="80" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="url(#textGrad)" letter-spacing="0.3">SJTU Course Downloader · All-in-One</text>

