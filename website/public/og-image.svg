      <!-- Watermark Shield in Badge -->
      <path d="M70 20 L110 36 C110 78 70 110 70 110 C70 110 30 78 30 36 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" />
      <!-- Graduation Cap -->
