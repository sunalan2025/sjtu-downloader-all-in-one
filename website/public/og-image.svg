      <text x="38" y="19" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#93C5FD">Windows</text>

