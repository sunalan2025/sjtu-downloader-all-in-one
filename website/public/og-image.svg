    <text x="160" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">客户端正式版 v2.5.1</text>

    <!-- Operating System Support Badges -->
    <g transform="translate(32, 320)">
