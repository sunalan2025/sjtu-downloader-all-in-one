      <text x="86" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#10B981">纯本地无感加密 · 零敏感数据上传</text>
