name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41192814550 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.2-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.2-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.2-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.2-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.2-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.2 Beta" \
              --notes "Android v0.4.2 Beta · 日历自动显示今天，桌面式按周课表时间网格 + 作业截止卡片；独立课表认证成功后自动刷新；顶栏改为状态栏下方悬浮玻璃条；交我办登录在隐藏官方 OAuth 页面生成动态链接后直接唤起 App，网页登录仅为备用。正式课表权限仍取决于学校 SSO，不能绕过授权。可直接覆盖安装旧 Beta。\\n\\n注意：这是采用公开测试签名的非正式 Beta 包，不能作为可信正式发行版；请勿通过不明来源传播或安装。会话与学校账号仍以学校官方 SSO 为准。"
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
