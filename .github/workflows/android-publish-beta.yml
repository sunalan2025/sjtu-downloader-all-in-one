name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41203334079 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.4-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.4-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.4-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.4-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.4-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.4 Beta" \
              --notes "Android v0.4.4 Beta: fixes repeated tab animations and flashing; aligns the seven-day timetable to one shared time axis; unifies the Android status bar and WebView background; preserves selection-to-download bottom dock. APK sourced from successful CI run 41203334079. Visual behavior on individual devices remains to be verified. Signed with a PUBLIC TEST-ONLY key. Not for production or trusted distribution."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
