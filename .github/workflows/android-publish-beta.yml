name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41321585237 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.16-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.16-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.16-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.16-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.16-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.16 Beta" \
              --notes "Android v0.4.16 Beta: Exam details from the same StudyAtSJTU and registrar sources as Desktop are now synchronized without another manual tap when the existing jAccount SSO session can be reused. If the separate exam session is missing, Android attempts a bounded invisible non-interactive WebView OAuth navigation to the Study and registrar portals, then fetches exams again; users still must complete any interactive identity verification themselves. Corrected Canvas deadline handling: all due_at dates are grouped by Asia/Shanghai rather than raw UTC string comparisons, per-course assignments are reconciled in the background even when the calendar API responds successfully, and the week timeline extends to midnight with enough visible space for a 23:59 homework card. On landscape tablets (width >= 740 CSS px and height >= 420 px), navigation is moved into a persistent left rail on Home, Courses, Calendar and Downloads; batch download action is moved to the content pane while the rail stays visible. Phones/portrait keep the bottom navigation. GitHub Actions CI build 41321585237 completed all 14 steps successfully. Actual school SSO and late-night deadlines require live-account verification, and OEM tablet layouts still require real-device inspection. Public test-signed beta only."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
