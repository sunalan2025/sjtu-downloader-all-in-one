name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41219541926 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.10-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.10-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.10-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.10-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.10-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.10 Beta" \
              --notes "Android v0.4.10 Beta: optimized independent SJTU timetable authentication using a bounded one-day API probe instead of a full-month fetch, bypassed re-login when the official calendar session is recently verified, isolated calendar auth from bulk Canvas requests, stopped a competing background SSO WebView, and removed duplicate post-auth refresh. A successful jAccount login always lands on Home immediately; course sync continues asynchronously. The week view now uses a neutral 'Calendar' heading rather than 'three-day', and its all-day lane grows to fit every homework/all-day item and wraps full titles. TypeScript, Android APK build and APK identity checks passed in GitHub Actions run 41219541926. Connection speed and full-day layout require real-device/network validation. Signed with a public test key, not production trusted."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
