name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41204627440 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.5-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.5-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.5-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.5-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.5-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.5 Beta" \
              --notes "SJTU Downloader Android v0.4.5 Beta. Fixed the bright top strip by removing the duplicate HTML status overlay and aligning native Android system-bar paint. Replaced snapshot-based View Transitions with one-surface directional mask transitions to avoid ghost trails. Redesigned weekly timetable for portrait screens: readable 2-day or 3-day panes, 7-day layout on tablets, swipe and arrow navigation; all dates share the same clock axis. Built and APK-validated by CI run 41204627440. Physical-device visual verification is still needed. WARNING: this beta is signed with a PUBLIC TEST KEY only."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
