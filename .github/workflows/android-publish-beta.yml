name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41191352430 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.1-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.1-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.1-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.1-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.1-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.1 Beta" \
              --notes "Android v0.4.1 Beta · 修复课程文件列表偶发 Software caused connection abort，采用短暂自动重试和页内重试按钮，并保持学期分类、批量下载与 Liquid Glass 界面。下载下方 APK 文件即可覆盖安装，无须进入 Actions。\\n\\n注意：这是采用公开测试签名的非正式 Beta 包，不能作为可信正式发行版；请勿通过不明来源传播或安装。会话与学校账号仍以学校官方 SSO 为准。"
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
