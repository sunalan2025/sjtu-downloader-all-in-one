name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41324875052 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.17-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.17-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.17-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.17-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.17-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.17 Beta" \
              --notes "Android v0.4.17 Beta: Replaces the tablet landscape sidebar's relocated glass sliding-pill navigation with a purpose-built collapsible vertical menu. Expanded: left-aligned 21px icon, main label, and short secondary description for Home/Courses/Calendar/Downloads in long horizontal rows; collapsed: compact accessible icon buttons with an expand control. Soft blue row gradients and a restrained active-side accent replace the raised white-glass selection pill. The former floating rail backdrop, hard glass border, and side shadow are removed. A single shared application background extends under the sidebar, with a broad feathered gradient toward the main content to avoid visible color seams. Main content and batch action adapt smoothly to sidebar width; tablet size and rotation choose compact/wide defaults unless the user has explicitly set a preference. Phone and portrait bottom navigation is unchanged. Accessibility and reduced-motion rules preserved. CI Android build 41324875052 passed all 14 steps; actual OEM launcher appearance, unusual DPI and split screen need physical-device inspection. Public test-signed beta only."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
