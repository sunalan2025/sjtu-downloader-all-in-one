name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41210715033 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.8-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.8-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.8-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.8-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.8-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.8 Beta" \
              --notes "Android v0.4.8 Beta: week timetable displays the real room/location supplied by the SJTU calendar API; day mode is now a clear, narrow-screen list grouped into Schedule, Homework and Exams (exam detection uses title keywords, not an official exam flag). Home Recent Agenda groups events into Today, Tomorrow, Day After Tomorrow and later month/day sections; always based on the actual current date even after browsing another week. Completely redesigned the downloads page into stable responsive active/history cards with progress, path and open controls. Removed manual course/calendar refresh buttons and added automatic calendar updates on foreground, network reconnection and timer. Built and APK-validated by GitHub Actions run 41210715033. Physical-device display remains to be tested. Signed with public test key; NOT a trusted production release."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
