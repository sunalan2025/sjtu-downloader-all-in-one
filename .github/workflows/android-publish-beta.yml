name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41269921100 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.13-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.13-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.13-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.13-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.13-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.13 Beta" \
              --notes "Android v0.4.13 Beta: fixed OEM/OriginOS/HyperOS launcher widgets that showed no text by removing an unsupported android.view.View divider from the RemoteViews layout (now uses the supported TextView class). Includes a minimal supported-layout fallback, diagnostics for widget instance count, cached classes/deadlines, last sync and render attempt, and an optional Home widget status panel. A manual Repaint Widget action and Android App/Battery Settings links help users diagnose vendor background restrictions, with per-brand instructions for Vivo/iQOO, Xiaomi/Redmi, OPPO/realme/OnePlus and Huawei/Honor. No unrelated media/storage permissions or automatic battery bypass. The current-week classes now publish immediately as soon as their own request finishes, without waiting for future weeks. Built and APK validated by GitHub Actions run 41269921100. Vendor-specific launcher rendering still needs testing on a physical OEM device; status reports update attempts rather than confirmation of pixels. Public TEST-SIGNED beta only."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
