name: Publish Android Beta APK to GitHub Releases

on:
  push:
    branches: [feature/android-mvp]
    paths:
      - '.github/workflows/android-publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from previously successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 41270695507 --repo "$REPO" --name sjtu-downloader-android-debug --dir downloaded
          test -s downloaded/app-debug.apk
          unzip -t downloaded/app-debug.apk | tail -1
          cp downloaded/app-debug.apk SJTU-Downloader-Android-v0.4.14-Beta.apk
          sha256sum SJTU-Downloader-Android-v0.4.14-Beta.apk | tee SHA256SUMS.txt
      - name: Create stable public prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-v0.4.14-beta
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" SJTU-Downloader-Android-v0.4.14-Beta.apk SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" SJTU-Downloader-Android-v0.4.14-Beta.apk SHA256SUMS.txt \
              --repo "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "SJTU Downloader Android v0.4.14 Beta" \
              --notes "Android v0.4.14 Beta: mobile calendar now includes genuine, individually authenticated SJTU examination information like the desktop client. Native HTTPS integration queries j.sjtu.edu.cn/app/stu/exam/semester/list (semester from school/calendar/info) and falls back to the registrar i.sjtu.edu.cn/kwgl/kscx_cxXsksxxIndex.html exam listing when available. Official exam events include subject, exam type, China Standard Time, exam-room location and distinct purple exam styling in the centered weekly timetable and chronological day timeline. Exams also appear in Home Recent Agenda and the 14-day widget Deadline feed. When the exam portals require their own SSO session, the Calendar page provides separate Connect Exam options for StudyAtSJTU and registrar, using an in-app WebView with jAccount popup support; lack of authorization is not misreported as no exams. Exam fetching uses a separate executor and 5-minute cache, without blocking school timetable loads. JavaScript typecheck, Android APK build and APK identity checks passed in GitHub Actions run 41270695507. Real exam-data/login verification still needs a university account and physical-device testing. This is a publicly TEST-SIGNED beta only."
          fi
          gh release view "$TAG" --repo "$REPO" --json url,assets | tee release.json
