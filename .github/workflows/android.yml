name: Android MVP Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-mvp
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners already ship Android cmdline-tools and SDK.
      # The deprecated setup-android@v3 action requests removed package `tools`.
      - name: Verify Android SDK and install required packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Android SDK manager missing"; exit 1; }
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install and build mobile UI
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run android:prepare
          cp -r android-overlay/. android/
          npm run android:prepare
      - name: Use stable test signing certificate
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode mobile/signing/TEST_ONLY_debug.keystore.base64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build debug APK
        working-directory: mobile/android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sjtu-downloader-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
