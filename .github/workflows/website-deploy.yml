name: Deploy Showcase Website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'docs/images/**'
      - '.github/workflows/website-deploy.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Verify download metadata and platform selection
        working-directory: website
        run: npm test

      - name: Check website
        working-directory: website
        run: npm run check

      - name: Build showcase website
        working-directory: website
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check responsive website in browser
        working-directory: website
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            UI_TEST_BROWSER="$(command -v google-chrome)" npm run test:ui
          else
            npx playwright install --with-deps chromium
            npm run test:ui
          fi

      - name: Upload website browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-evidence
          path: website/ui-results/
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
