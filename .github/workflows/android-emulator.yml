name: Android Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feature/android-mvp]
    paths:
      - 'mobile/scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-emulator.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build beta APK
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run android:prepare
          npm run android:icons
          mkdir -p "$HOME/.android"
          base64 --decode signing/TEST_ONLY_debug.keystore.base64 > "$HOME/.android/debug.keystore"
          cd android
          bash ./gradlew assembleDebug --no-daemon
      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash mobile/scripts/android-emulator-smoke.sh
            cd mobile/android
            ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-evidence
          path: mobile/emulator-results/
          if-no-files-found: warn
